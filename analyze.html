<script>
const tier = localStorage.getItem('tier') || 'd_j';
const skill = localStorage.getItem('skill') || 'Writing a thesis';
const wantsThesis = skill === 'Writing a thesis';

function getQ4(textId, tierKey) {
  const q4s = {
    'hungry-caterpillar': {
      thesis: "Why do you think the author wrote this story? What is he trying to teach us?",
      evidence: "Find one part of the passage that made you think the caterpillar ate too much. What words told you that?",
      analysis: "Why do you think the caterpillar kept eating even though he was getting full? What does that tell us?"
    },
    'wild-things': {
      thesis: "Why do you think the author wrote this story? What is he trying to tell us about kids who get in trouble?",
      evidence: "Find one sentence that shows Max was feeling wild and out of control. Why did you pick that one?",
      analysis: "Why do you think the forest grew in Max's room instead of somewhere else? What could that mean?"
    },
    'charlottes-web': {
      thesis: "Why do you think E.B. White wrote this passage? What is he trying to make us feel or understand?",
      evidence: "Find one specific word or sentence that best shows how Wilbur is feeling. Why did you pick that one?",
      analysis: "Why do you think Wilbur feels lonely even though the barn is full of animals? What does that tell us about loneliness?"
    },
    'charlie-chocolate': {
      thesis: "Why do you think Roald Dahl described the factory this way? What feeling is he trying to create?",
      evidence: "Find one word or phrase that best creates the feeling of mystery. Why did you pick that one?",
      analysis: "Why do you think Dahl uses sounds AND smells to describe the factory instead of just telling us what it looks like?"
    },
    'matilda': {
      thesis: "What do you think Roald Dahl is arguing about reading and imagination through Matilda's character?",
      evidence: "Find one specific detail that best shows how unusual Matilda is. Quote it and explain why you chose it.",
      analysis: "Dahl says books 'transported' Matilda into new worlds. Why do you think he chose that specific word? What does it suggest about reading?"
    },
    'ivan': {
      thesis: "What do you think Katherine Applegate is arguing about identity and how others see us through Ivan's words?",
      evidence: "Find the most powerful sentence in this passage. Quote it and explain exactly why it is the strongest piece of evidence.",
      analysis: "Ivan says the names people give him are 'their way of making me small.' Why does he use the word 'small'? What does it represent?"
    },
    'little-women': {
      thesis: "What argument is Alcott making about how people respond differently to hardship through these four sisters?",
      evidence: "Which sister's line is the most powerful piece of evidence for the passage's central idea? Quote it and explain why it carries the most weight.",
      analysis: "Alcott uses only dialogue — no description — to reveal character. What is the effect of that choice? What does it allow her to show?"
    },
    'secret-garden': {
      thesis: "What argument is Burnett making about how environment shapes character through Mary's behavior?",
      evidence: "Find the detail that most powerfully shows the contrast between Mary's world and what is happening around her. Quote it and explain its significance.",
      analysis: "Burnett never directly tells us what is wrong — she shows it through the servants' behavior. Why is that more effective than just stating the problem?"
    },
    'gatsby': {
      thesis: "What complex argument is Fitzgerald making about privilege, judgment, and the American Dream through Nick's contradictory narration?",
      evidence: "Identify the single most important line in this passage for understanding Fitzgerald's central argument. Quote it and build your analysis from it.",
      analysis: "Nick presents himself as non-judgmental but immediately contradicts that. What is Fitzgerald doing by giving us an unreliable narrator?"
    },
    'alice': {
      thesis: "What complex argument is Carroll making about childhood, imagination, or escapism through Alice's behavior in this passage?",
      evidence: "Identify the most significant detail Carroll includes and explain exactly how it supports a larger argument about curiosity or imagination.",
      analysis: "Carroll describes the fall as dreamlike and consequence-free. What does that specific narrative choice argue about the relationship between imagination and reality?"
    }
  };
  const skillKey = skill === 'Writing a thesis' ? 'thesis' : skill === 'Finding evidence' ? 'evidence' : 'analysis';
  return q4s[textId] ? q4s[textId][skillKey] : "What do you think the author is trying to say? How does this passage support that idea?";
}

const texts = [
  {
    id: 'hungry-caterpillar',
    title: 'The Very Hungry Caterpillar',
    author: 'Eric Carle',
    passage: "On Monday he ate through one apple. On Tuesday he ate through two pears. On Wednesday he ate through three plums. On Thursday he ate through four strawberries. On Friday he ate through five oranges. On Saturday he ate through one piece of chocolate cake, one ice-cream cone, one pickle, one slice of Swiss cheese, one slice of salami, one lollipop, one piece of cherry pie, one sausage, one cupcake, and one slice of watermelon. That night he had a stomachache!",
    tiers: ['aa_c'],
    getQuestions: function() {
      return [
        { text: "What did the caterpillar eat? Did he eat a little or a lot?", context: null },
        { text: "Why do you think his tummy hurt on Saturday?", context: null },
        { text: "Did anything in this passage surprise you? What?", context: null },
        { text: getQ4('hungry-caterpillar', 'aa_c'), context: null },
        { text: "Now that we talked about it — what do you think this story is really about? Write one sentence!", context: null }
      ];
    }
  },
  {
    id: 'wild-things',
    title: 'Where the Wild Things Are',
    author: 'Maurice Sendak',
    passage: "The night Max wore his wolf suit and made mischief of one kind and another his mother called him 'WILD THING!' and Max said 'I'LL EAT YOU UP!' so he was sent to bed without eating anything. That very night in Max's room a forest grew and grew and grew until his ceiling hung with vines and the walls became the world all around.",
    tiers: ['aa_c'],
    getQuestions: function() {
      return [
        { text: "Why did Max get in trouble?", context: null },
        { text: "Something magical happens in Max's room. What is it?", context: null },
        { text: "How do you think Max felt when the forest started growing?", context: null },
        { text: getQ4('wild-things', 'aa_c'), context: null },
        { text: "What do you think this story is trying to tell us? Write one sentence — your best guess!", context: null }
      ];
    }
  },
  {
    id: 'charlottes-web',
    title: "Charlotte's Web",
    author: 'E.B. White',
    passage: "Wilbur didn't want food, he wanted love. He wanted a friend — someone who would play with him. But no one came, no one spoke to him, and he began to cry. The barn was very large. It was very old. It smelled of hay and it smelled of manure. It smelled of the perspiration of tired horses and the wonderful sweet breath of patient cows. Wilbur liked it.",
    tiers: ['d_j'],
    getQuestions: function() {
      return [
        { text: "How is Wilbur feeling? What words tell you that?", context: null },
        { text: "What does Wilbur want more than food?", context: null },
        { text: "Does Wilbur like the barn? What makes you think that?", context: null },
        { text: getQ4('charlottes-web', 'd_j'), context: null },
        { text: "Write one sentence — what is the author trying to tell us about what Wilbur needs? That's your claim!", context: null }
      ];
    }
  },
  {
    id: 'charlie-chocolate',
    title: 'Charlie and the Chocolate Factory',
    author: 'Roald Dahl',
    passage: "Nobody ever went in, and nobody ever came out. Yet every day, the workers in the factory heard, coming from somewhere deep inside, the most wonderful music — a grand, booming, rushing, whispering sound, as though the great hidden chocolate river was flowing endlessly on and on. And the smell! Great swooping whiffs of chocolate came drifting out through the dark, mysterious air.",
    tiers: ['d_j'],
    getQuestions: function() {
      return [
        { text: "What is strange about the chocolate factory?", context: null },
        { text: "What do the workers hear and smell? How does that make you feel?", context: null },
        { text: "Why do you think nobody ever goes in or comes out?", context: null },
        { text: getQ4('charlie-chocolate', 'd_j'), context: null },
        { text: "Write one sentence — what do you think the author wants us to feel about the chocolate factory? That's your claim!", context: null }
      ];
    }
  },
  {
    id: 'matilda',
    title: 'Matilda',
    author: 'Roald Dahl',
    passage: "Matilda was a little late in starting to read, but once she did, she read everything she could lay her hands on. By the age of three, Matilda had worked her way through all the books in the children's section and had begun wandering the shelves of the grown-up library. The books transported her into new worlds and introduced her to amazing people who lived exciting lives.",
    tiers: ['k_p'],
    getQuestions: function() {
      return [
        { text: "What makes Matilda unusual compared to other kids?", context: null },
        { text: "What does 'the books transported her into new worlds' mean? Have you ever felt that way?", context: null },
        { text: "Why do you think the author mentions that Matilda started reading late but then read everything she could?", context: null },
        { text: getQ4('matilda', 'k_p'), context: null },
        { text: "Write a claim — one sentence about what the author is saying about reading and imagination!", context: null }
      ];
    }
  },
  {
    id: 'ivan',
    title: 'The One and Only Ivan',
    author: 'Katherine Applegate',
    passage: "I am Ivan. I am a gorilla. It's not as easy as it looks. People call me the Freeway Gorilla. The Ape at Exit 8. The One and Only Ivan, Mighty Silverback. The names people give me are their way of making me small. I am not small.",
    tiers: ['k_p'],
    getQuestions: function() {
      return [
        { text: "Who is telling this story? What do we learn about him right away?", context: null },
        { text: "Ivan says the names people give him make him 'small.' What does he mean?", context: null },
        { text: "Why do you think Ivan says 'I am not small' at the very end?", context: null },
        { text: getQ4('ivan', 'k_p'), context: null },
        { text: "Write a claim — one sentence about what Ivan is telling us about how names and labels affect a person!", context: null }
      ];
    }
  },
  {
    id: 'little-women',
    title: 'Little Women',
    author: 'Louisa May Alcott',

    tiers: ['q_t'],

        { text: "How does each sister respond to not having presents? What does each response tell us about her character?", context: null },

        { text: "Beth says they have 'each other' — how does her response contrast with her sisters'?", context: null },

        { text: getQ4('secret-garden', 'q_t'), context: { title: "British Colonialism", text: "British colonialism was a period lasting from the 1600s to the mid-1900s during which Britain controlled large parts of the world, including India. It came with strong beliefs about racial and cultural superiority that shaped social structures, daily life, and the relationships between different groups of people." } },

let currentQ = 0;
let answers = [];
let coldThesis = '';
let seconds = 0;
let timerInterval = null;
let activeQuestions = [];
let selectedText = null;

function pickText() {
  let seen = JSON.parse(localStorage.getItem('seenTexts') || '[]');
  const available = texts.filter(t => t.tiers.includes(tier));
  const unseen = available.filter(t => !seen.includes(t.id));
  if (unseen.length === 0) {
    localStorage.setItem('seenTexts', '[]');
    return available[Math.floor(Math.random() * available.length)];
  }
  return unseen[Math.floor(Math.random() * unseen.length)];
}

window.addEventListener('DOMContentLoaded', function() {
  selectedText = pickText();
  document.getElementById('text-preview').textContent = selectedText.passage;
  document.getElementById('text-preview-2').textContent = selectedText.passage;
  document.getElementById('text-source').textContent = '— ' + selectedText.title + ' by ' + selectedText.author;

  const isYoung = tier === 'aa_c' || tier === 'd_j';
  if (isYoung) {
    document.getElementById('cold-thesis-question').textContent =
      "Before we start — just from reading the passage, what do you think the author wrote this for? Just your best guess in one sentence, no wrong answers!";
  } else {
    document.getElementById('cold-thesis-question').textContent =
      "Before we dive in, read the passage and try writing a claim in one sentence — what do you think the author is trying to say? Don't worry about being perfect, just give it a shot!";
  }
});

function goToStep2() {
  startTimer();
  if (wantsThesis) {
    document.getElementById('step-1').classList.add('hidden');
    document.getElementById('step-2').classList.remove('hidden');
  } else {
    startQuestions();
  }
}

function startQuestions() {
  activeQuestions = selectedText.getQuestions();
  document.getElementById('text-display').textContent = selectedText.passage;
  document.getElementById('step-1').classList.add('hidden');
  document.getElementById('step-2').classList.add('hidden');
  document.getElementById('step-3').classList.remove('hidden');
  showQuestion(0);
  const seen = JSON.parse(localStorage.getItem('seenTexts') || '[]');
  if (!seen.includes(selectedText.id)) {
    seen.push(selectedText.id);
    localStorage.setItem('seenTexts', JSON.stringify(seen));
  }
  localStorage.setItem('currentText', selectedText.title);
}

function saveColdThesis() {
  const answer = document.getElementById('cold-thesis-answer').value.trim();
  if (answer === '') {
    alert("Give it your best shot — even just one sentence!");
    return;
  }
  coldThesis = answer;
  startQuestions();
}

function showQuestion(index) {
  const q = activeQuestions[index];
  document.getElementById('pip-question').textContent = q.text;
  const contextBtn = document.getElementById('context-btn');
  const contextCard = document.getElementById('context-card');
  if (q.context) {
    contextBtn.classList.remove('hidden');
    document.getElementById('context-title').textContent = q.context.title;
    document.getElementById('context-text').textContent = q.context.text;
  } else {
    contextBtn.classList.add('hidden');
  }
  contextCard.classList.add('hidden');
}

function toggleContext() {
  document.getElementById('context-card').classList.toggle('hidden');
}

function nextQuestion() {
  const answerBox = document.getElementById('user-answer');
  const answer = answerBox.value.trim();
  if (answer === '') {
    alert("Don't leave Pip hanging! Write something, even just a few words.");
    return;
  }
  answers.push({ question: activeQuestions[currentQ].text, answer });
  const thread = document.getElementById('qa-thread');
  const entry = document.createElement('div');
  entry.className = 'thread-entry';
  entry.innerHTML =
    '<div class="thread-q">Pip asked: <em>' + activeQuestions[currentQ].text + '</em></div>' +
    '<div class="thread-a">You wrote: ' + answer + '</div>';
  thread.appendChild(entry);
  answerBox.value = '';
  currentQ++;
  if (currentQ < activeQuestions.length) {
    showQuestion(currentQ);
    document.getElementById('pip-question-bubble').scrollIntoView({ behavior: 'smooth' });
  } else {
    finishPractice();
  }
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    seconds++;
    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    document.getElementById('timer').textContent = mins + ':' + secs;
  }, 1000);
}

function stopTimer() { clearInterval(timerInterval); }

function getFormattedTime() {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  if (mins === 0) return secs + ' seconds';
  if (secs === 0) return mins + ' minutes';
  return mins + ' min ' + secs + ' sec';
}

function finishPractice() {
  stopTimer();
  const finalAnswer = answers[answers.length - 1] ? answers[answers.length - 1].answer : '';
  const timeSpent = getFormattedTime();

  const sessionHistory = JSON.parse(localStorage.getItem('sessionHistory') || '[]');
  sessionHistory.push({
    date: new Date().toISOString(),
    text: selectedText.title,
    time: timeSpent,
    claim: finalAnswer,
    coldThesis: coldThesis,
    tier: tier,
    skill: skill
  });
  localStorage.setItem('sessionHistory', JSON.stringify(sessionHistory));

  const allResponses = answers.map(function(a, i) {
    return 'Q' + (i + 1) + ': ' + a.answer;
  }).join(' | ');

  fetch('https://script.google.com/macros/s/AKfycbw7jYFGdyhdqYvQMI_X_3BDuukx7tsRNTuqEh70rtZZMZOMv0qVm5yGYjbaRrTG5aAb/exec', {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      date: new Date().toLocaleDateString(),
      tier: tier,
      skill: skill,
      text: selectedText.title,
      time: timeSpent,
      coldThesis: coldThesis || 'N/A',
      finalClaim: finalAnswer,
      responses: allResponses
    })
  }).catch(function(err) {
    console.log('Sheet sync failed silently:', err);
  });

  document.getElementById('step-3').classList.add('hidden');
  document.getElementById('step-4').classList.remove('hidden');

  let doneMsg = '';
  if (coldThesis && finalAnswer) {
    doneMsg = 'You started with: "' + coldThesis + '"\n\nAfter working through it, you wrote: "' + finalAnswer + '"\n\nLook how far your thinking came!';
  } else {
    doneMsg = finalAnswer ? 'Here\'s the claim you built: "' + finalAnswer + '"' : "You worked through the whole analysis — that takes real skill!";
  }

  document.getElementById('done-msg').textContent = doneMsg;
  document.getElementById('final-time').textContent = timeSpent;
}
</script>
